StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = Vigie

[*.{md,mdx}]
BasedOnStyles = Vale, Google, WriteGoodDocs
# The docs use British English, and both spelling checks are American.
Vale.Spelling = NO
Google.Spelling = NO
# Google allows an unspaced em dash. WriteGoodDocs.EmDash bans it outright.
Google.EmDash = NO
