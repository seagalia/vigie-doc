# Builds the site on every pull request, and publishes it to GitHub Pages from main, also once a day for the download page.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the download page lists the latest vigie release, read when the site is built
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the run in progress, so main deploys its latest commit
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # also fails on a broken internal link, through starlight-links-validator
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
